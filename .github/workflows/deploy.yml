name: Deploy Next.js to EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Environment Variables
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env.production

      - name: Build Next.js App
        run: npm run build

      - name: Prepare Standalone Output
        # The standalone build needs the static and public folders copied into it manually
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env
          cp ecosystem.config.js .next/standalone/

      - name: Deploy to EC2 via rsync
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          RELEASE: /home/ubuntu/my-app-${{ github.sha }}
        run: |
          # Set up SSH key securely
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Upload to an isolated directory so PM2 never serves a half-written build.
          ssh $USER@$HOST "rm -rf '$RELEASE' && mkdir -p '$RELEASE'"
          rsync -az --delete .next/standalone/ $USER@$HOST:$RELEASE/

          # Keep the existing PM2 config with the new release if it lives in the app root.
          ssh $USER@$HOST "if [ -f /home/ubuntu/my-app/ecosystem.config.js ]; then cp /home/ubuntu/my-app/ecosystem.config.js '$RELEASE/'; fi"

          # Keep older static chunks available to clients holding cached HTML/RSC data.
          ssh $USER@$HOST "if [ -d /home/ubuntu/my-app/.next/static ]; then cp -a /home/ubuntu/my-app/.next/static/. '$RELEASE/.next/static/'; fi"

          # Replace the live directory after the upload has completed.
          ssh $USER@$HOST "mv /home/ubuntu/my-app /home/ubuntu/my-app-previous-${{ github.sha }} 2>/dev/null || true && mv '$RELEASE' /home/ubuntu/my-app"

      - name: Link IP Database
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/my-app
            mkdir -p node_modules/geoip-lite/data
            rm -f node_modules/geoip-lite/data/*
            ln -s -t node_modules/geoip-lite/data /home/ubuntu/map-data/*

      - name: Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/my-app
            if [ -f ecosystem.config.js ]; then
              npx --yes pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            else
              pm2 start "node server.js" --name fedun-site --watch false --env-production
            fi
            npx --yes pm2 save
            rm -rf /home/ubuntu/my-app-previous-*